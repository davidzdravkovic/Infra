map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=ws_handshake:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name connectroom.duckdns.org;

    include /etc/nginx/snippets/chat-locations.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name connectroom.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/connectroom.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connectroom.duckdns.org/privkey.pem;

    include /etc/nginx/snippets/chat-locations.conf;
}

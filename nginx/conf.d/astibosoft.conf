server {
    listen 80;
    listen [::]:80;
    server_name astibosoft.com www.astibosoft.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name astibosoft.com www.astibosoft.com;

    ssl_certificate     /etc/letsencrypt/live/astibosoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astibosoft.com/privkey.pem;

    include /etc/nginx/snippets/astibosoft-locations.conf;
}

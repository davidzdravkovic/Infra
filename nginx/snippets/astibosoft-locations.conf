root /usr/share/nginx/astibosoft;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json;

location /api/ {
    proxy_pass http://astibosoft-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Flutter founder admin — separate volume ASTIBOSOFT_ADMIN_DIST
# (build with --base-href /admin/)
location = /admin {
    return 301 /admin/;
}

location /admin/ {
    alias /usr/share/nginx/astibosoft-admin/;
    try_files $uri $uri/ @astibosoft_admin_spa;
}

location @astibosoft_admin_spa {
    rewrite ^ /admin/index.html last;
}

# Concept previews. Host folder is one directory per company, each the Vite dist.
# Build with base /preview/<company>/ so /preview/excalibur/ serves that folder.
# /preview/ itself is not a list of companies.
location = /preview {
    return 404;
}

location = /preview/ {
    return 404;
}

location /preview/ {
    alias /usr/share/nginx/previews/;
    index index.html;
    autoindex off;
}

location / {
    try_files $uri $uri/ /index.html;
}
